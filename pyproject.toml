[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jira-release-evidence-agent"
version = "1.0.0"
description = "Sequential, evidence-grounded release readiness assessments from Jira"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
release-agent = "release_agent.main:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
markers = [
    "jira_integration: opt-in tests that read the configured live Jira project",
]

[tool.pyright]
extraPaths = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"prompts" = ["prompts/*.txt", "prompts/*.json"]
